[project]
name = "researchforge-ai"
version = "0.1.0"
description = "Production-grade multi-agent multimodal RAG platform with LangGraph orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Muhammad Nabeed Haider" }
]

keywords = [
    "ai",
    "rag",
    "langgraph",
    "multi-agent",
    "fastapi",
    "streamlit",
]

dependencies = []

[project.optional-dependencies]

backend = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "loguru",
]

frontend = [
    "streamlit",
    "httpx",
]

eval = []

docs = []

[dependency-groups]
backend = [
    "openai>=2.48.0",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
    "isort",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
